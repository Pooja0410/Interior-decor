<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Interior Decor Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Interior Decor Store</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="products">
            <h2>All Products</h2>
            <div id="category-filter">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="Decor">Decor</button>
                <button class="filter-btn" data-category="Lighting">Lighting</button>
                <button class="filter-btn" data-category="Kitchen">Kitchen</button>
                <button class="filter-btn" data-category="Textiles">Textiles</button>
                <button class="filter-btn" data-category="Flooring">Flooring</button>
            </div>
            <div id="products-container">
                <!-- Products will be loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Interior Decor Store</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
