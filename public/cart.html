<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Interior Decor Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Interior Decor Store</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="cart">
            <h2>Shopping Cart</h2>
            <div id="cart-items">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="total">
                Total: $<span id="total-price">0.00</span>
            </div>
            <h3>Checkout</h3>
            <!--<form id="checkout-form">
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div>
                    <label for="address">Address:</label>
                    <input type="text" id="address" required>
                </div>
                <button type="button" onclick="checkout()">Place Order</button>
            </form>-->
            <form id="checkout-form" method="POST" action="/checkout">
                <!-- Hidden fields for cart and total -->
                <input type="hidden" id="cartItems" name="cartItems">
                <input type="hidden" id="totalPrice" name="total">

                <!-- Customer details -->
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <!-- Single checkout button -->
                <button type="button" onclick="checkout()">Place Order</button>
            </form>



        </section>
    </main>

    <footer>
        <p>&copy; 2023 Interior Decor Store</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
